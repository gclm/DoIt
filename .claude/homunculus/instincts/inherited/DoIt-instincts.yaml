# DoIt Workflow Dependency Update And Merge

## Action

Follow the dependency-update-and-merge workflow:
1. Update dependency version in relevant lock and manifest files (e.g., package.json, package-lock.json, flake.lock)
2. Commit the changes with a message indicating the dependency bump
3. Open a pull request for the update
4. Merge the pull request into the main branch

## Evidence

- Workflow detected from commit patterns
- Frequency: ~3x per month
- Files: package.json, package-lock.json, flake.lock

